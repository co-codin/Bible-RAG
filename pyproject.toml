[project]
name = "bible-rag"
version = "0.1.0"
description = "Multilingual RAG over the Bible and the Quran (Milvus + bge-m3 + DeepEval)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymilvus[milvus-lite]>=2.5",
    "FlagEmbedding>=1.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "openai>=1.40",        # DeepSeek / Qwen via OpenAI-compatible APIs
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "deepeval>=2.0",
    "anthropic>=0.40",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bible_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
